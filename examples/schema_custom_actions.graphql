# GraphQL Cascade - Custom Actions Example
# Password reset and other custom business logic

# Core Cascade types, directives and scalars come from reference/cascade_base.graphql;
# this file adds the application's own types.

# Domain entities

type User implements Node & Timestamped {
  id: ID!
  email: String!
    @cascadeInvalidates(queries: ["getUser", "getCurrentUser", "listUsers"])
  name: String!
    @cascadeInvalidates(queries: ["getUser", "getCurrentUser", "listUsers"])
  role: UserRole!
    @cascadeInvalidates(queries: ["listUsers"])
  isEmailVerified: Boolean!
    @cascadeInvalidates(queries: ["getUser", "getCurrentUser", "listUsers"])
  lastLoginAt: DateTime
  passwordResetToken: PasswordResetToken
  createdAt: DateTime!
  updatedAt: DateTime!
    @cascadeInvalidates(queries: ["getUser", "getCurrentUser", "listUsers"])
  version: Int
}

type PasswordResetToken implements Node & Timestamped {
  id: ID!
  user: User!
  token: String!
  expiresAt: DateTime!
  isUsed: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
  version: Int
}

type EmailVerificationToken implements Node & Timestamped {
  id: ID!
  user: User!
  token: String!
  expiresAt: DateTime!
  isUsed: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
  version: Int
}

type AuditLog implements Node & Timestamped {
  id: ID!
  user: User
  action: String!
  resourceType: String!
  resourceId: ID!
  details: JSON
  ipAddress: String
  userAgent: String
  createdAt: DateTime!
  updatedAt: DateTime!
  version: Int
}

enum UserRole {
  ADMIN
  USER
  GUEST
}

# Input types

input SendPasswordResetInput {
  email: String!
}

input ResetPasswordInput {
  token: String!
  newPassword: String!
}

input VerifyEmailInput {
  token: String!
}

input ChangePasswordInput {
  currentPassword: String!
  newPassword: String!
}

input UpdateProfileInput {
  name: String
  email: String
}

# Response types

type SendPasswordResetCascade implements CascadeResponse {
  success: Boolean!
  errors: [CascadeError!]
  data: PasswordResetResult
  cascade: CascadeUpdates!
}

type ResetPasswordCascade implements CascadeResponse {
  success: Boolean!
  errors: [CascadeError!]
  data: User
  cascade: CascadeUpdates!
}

type VerifyEmailCascade implements CascadeResponse {
  success: Boolean!
  errors: [CascadeError!]
  data: User
  cascade: CascadeUpdates!
}

type ChangePasswordCascade implements CascadeResponse {
  success: Boolean!
  errors: [CascadeError!]
  data: User
  cascade: CascadeUpdates!
}

type UpdateProfileCascade implements CascadeResponse {
  success: Boolean!
  errors: [CascadeError!]
  data: User
  cascade: CascadeUpdates!
}

# Custom result types

type PasswordResetResult {
  emailSent: Boolean!
  expiresAt: DateTime!
  rateLimitRemaining: Int!
}

type EmailVerificationResult {
  emailVerified: Boolean!
  user: User!
}

# Queries

type Query {
  # User queries
  getUser(id: ID!): User
  getCurrentUser: User

  listUsers(
    first: Int = 10
    after: String
    filter: UserFilter
    orderBy: UserOrderBy = CREATED_AT_DESC
  ): UserConnection!

  # Audit log queries (admin only)
  listAuditLogs(
    first: Int = 10
    after: String
    filter: AuditLogFilter
    orderBy: AuditLogOrderBy = CREATED_AT_DESC
  ): AuditLogConnection!
}

type UserConnection {
  edges: [UserEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type UserEdge {
  node: User!
  cursor: String!
}

type AuditLogConnection {
  edges: [AuditLogEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type AuditLogEdge {
  node: AuditLog!
  cursor: String!
}

input UserFilter {
  role: UserRole
  isEmailVerified: Boolean
  emailContains: String
  nameContains: String
}

input AuditLogFilter {
  userId: ID
  action: String
  resourceType: String
  resourceId: ID
  createdAfter: DateTime
  createdBefore: DateTime
}

enum UserOrderBy {
  CREATED_AT_ASC
  CREATED_AT_DESC
  NAME_ASC
  NAME_DESC
  EMAIL_ASC
  EMAIL_DESC
  LAST_LOGIN_ASC
  LAST_LOGIN_DESC
}

enum AuditLogOrderBy {
  CREATED_AT_ASC
  CREATED_AT_DESC
  ACTION_ASC
  ACTION_DESC
}

# Mutations

type Mutation {
  # Authentication mutations
  sendPasswordReset(input: SendPasswordResetInput!): SendPasswordResetCascade!
    @cascade(maxDepth: 2, excludeTypes: ["AuditLog"])

  resetPassword(input: ResetPasswordInput!): ResetPasswordCascade!
    @cascade(maxDepth: 2, excludeTypes: ["AuditLog"])

  verifyEmail(input: VerifyEmailInput!): VerifyEmailCascade!
    @cascade(maxDepth: 2, excludeTypes: ["AuditLog"])

  changePassword(input: ChangePasswordInput!): ChangePasswordCascade!
    @cascade(maxDepth: 1, excludeTypes: ["AuditLog"])

  # Profile mutations
  updateProfile(input: UpdateProfileInput!): UpdateProfileCascade!
    @cascade(maxDepth: 1, excludeTypes: ["AuditLog"])
}

