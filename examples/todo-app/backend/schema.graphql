# GraphQL Cascade TODO App Schema
# Demonstrates basic CRUD operations with GraphQL Cascade.
#
# Core Cascade types, directives and scalars come from reference/cascade_base.graphql;
# this file adds the application's own types.

type User implements Node & Timestamped {
  id: ID!
  email: String!
  name: String!
  todos: [Todo!]!
  createdAt: DateTime!
  updatedAt: DateTime!
  version: Int
}

type Todo implements Node & Timestamped {
  id: ID!
  title: String!
  description: String
  completed: Boolean!
  owner: User!
  createdAt: DateTime!
  updatedAt: DateTime!
  version: Int
}

# Mutation Response Types
type CreateUserCascade implements CascadeResponse {
  success: Boolean!
  errors: [CascadeError!]
  data: User
  cascade: CascadeUpdates!
}

type UpdateUserCascade implements CascadeResponse {
  success: Boolean!
  errors: [CascadeError!]
  data: User
  cascade: CascadeUpdates!
}

type DeleteUserCascade implements CascadeResponse {
  success: Boolean!
  errors: [CascadeError!]
  data: User
  cascade: CascadeUpdates!
}

type CreateTodoCascade implements CascadeResponse {
  success: Boolean!
  errors: [CascadeError!]
  data: Todo
  cascade: CascadeUpdates!
}

type UpdateTodoCascade implements CascadeResponse {
  success: Boolean!
  errors: [CascadeError!]
  data: Todo
  cascade: CascadeUpdates!
}

type DeleteTodoCascade implements CascadeResponse {
  success: Boolean!
  errors: [CascadeError!]
  data: Todo
  cascade: CascadeUpdates!
}

# Input Types
input CreateUserInput {
  email: String!
  name: String!
}

input UpdateUserInput {
  email: String
  name: String
}

input CreateTodoInput {
  title: String!
  description: String
  ownerId: ID!
}

input UpdateTodoInput {
  title: String
  description: String
  completed: Boolean
}

# Queries
type Query {
  # Get single entities
  getUser(id: ID!): User
  getTodo(id: ID!): Todo

  # List entities
  listUsers(limit: Int = 10, offset: Int = 0): [User!]!
  listTodos(limit: Int = 10, offset: Int = 0): [Todo!]!

  # Search
  searchUsers(query: String!): [User!]!
  searchTodos(query: String!): [Todo!]!
}

# Mutations
type Mutation {
  # User mutations
  createUser(input: CreateUserInput!): CreateUserCascade!
    @cascade(maxDepth: 2)

  updateUser(id: ID!, input: UpdateUserInput!): UpdateUserCascade!
    @cascade(maxDepth: 2)

  deleteUser(id: ID!): DeleteUserCascade!
    @cascade(maxDepth: 3)  # Cascade to delete user's todos

  # Todo mutations
  createTodo(input: CreateTodoInput!): CreateTodoCascade!
    @cascade(maxDepth: 2)

  updateTodo(id: ID!, input: UpdateTodoInput!): UpdateTodoCascade!
    @cascade(maxDepth: 2)

  deleteTodo(id: ID!): DeleteTodoCascade!
    @cascade(maxDepth: 1)
}
