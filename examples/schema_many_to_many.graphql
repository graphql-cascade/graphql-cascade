# GraphQL Cascade Example: Many-to-Many Relationships
# Order with Products through OrderItem - demonstrates complex cascading through junction entities

# Core Cascade types, directives and scalars come from reference/cascade_base.graphql;
# this file adds the application's own types.

# Domain entities

"""
Order entity with many-to-many relationship to Products through OrderItem
"""
type Order implements Node & Timestamped {
  id: ID!
  orderNumber: String!
  customer: User!
    @cascadeInvalidates(queries: ["listOrders", "getUser"])
  items: [OrderItem!]!
  total: Float!
    @cascadeInvalidates(queries: ["listOrders", "getOrder"])
  status: OrderStatus!
    @cascadeInvalidates(queries: ["listOrders", "getOrder"])
  shippingAddress: Address!
  createdAt: DateTime!
  updatedAt: DateTime!
  version: Int
}

type OrderItem {
  id: ID!
  order: Order!
  product: Product!
  quantity: Int!
    @cascadeInvalidates(queries: ["getOrder"])
  unitPrice: Float!
  totalPrice: Float!
}

type Product implements Node {
  id: ID!
  name: String!
    @cascadeInvalidates(queries: ["listProducts", "searchProducts"])
  description: String
  price: Float!
    @cascadeInvalidates(queries: ["listProducts", "getProduct"])
  category: ProductCategory!
    @cascadeInvalidates(queries: ["listProducts"])
  inventory: Int!
    @cascadeInvalidates(queries: ["listProducts"])
  isActive: Boolean!
    @cascadeInvalidates(queries: ["listProducts"])
}

type User implements Node & Timestamped {
  id: ID!
  email: String!
    @cascadeInvalidates(queries: ["listUsers"])
  name: String!
    @cascadeInvalidates(queries: ["listUsers"])
  orders: [Order!]!
  createdAt: DateTime!
  updatedAt: DateTime!
  version: Int
}

type Address implements Node {
  id: ID!
  street: String!
  city: String!
  state: String!
  country: String!
  postalCode: String!
}

enum OrderStatus {
  PENDING
  CONFIRMED
  PROCESSING
  SHIPPED
  DELIVERED
  CANCELLED
}

enum ProductCategory {
  ELECTRONICS
  CLOTHING
  BOOKS
  HOME
  SPORTS
  TOYS
}

# Input types

input CreateOrderInput {
  customerId: ID!
  items: [OrderItemInput!]!
  shippingAddressId: ID!
}

input OrderItemInput {
  productId: ID!
  quantity: Int!
}

input UpdateOrderInput {
  status: OrderStatus
  shippingAddressId: ID
  items: [OrderItemUpdateInput!]
}

input OrderItemUpdateInput {
  productId: ID!
  quantity: Int!
}

input AddProductToOrderInput {
  orderId: ID!
  productId: ID!
  quantity: Int!
}

input CreateProductInput {
  name: String!
  description: String
  price: Float!
  category: ProductCategory!
  inventory: Int!
}

input UpdateProductInput {
  name: String
  description: String
  price: Float
  category: ProductCategory
  inventory: Int
  isActive: Boolean
}

# Response types

type CreateOrderCascade implements CascadeResponse {
  success: Boolean!
  errors: [CascadeError!]
  data: Order
  cascade: CascadeUpdates!
}

type UpdateOrderCascade implements CascadeResponse {
  success: Boolean!
  errors: [CascadeError!]
  data: Order
  cascade: CascadeUpdates!
}

type AddProductToOrderCascade implements CascadeResponse {
  success: Boolean!
  errors: [CascadeError!]
  data: Order
  cascade: CascadeUpdates!
}

type CreateProductCascade implements CascadeResponse {
  success: Boolean!
  errors: [CascadeError!]
  data: Product
  cascade: CascadeUpdates!
}

type UpdateProductCascade implements CascadeResponse {
  success: Boolean!
  errors: [CascadeError!]
  data: Product
  cascade: CascadeUpdates!
}

# Queries

type Query {
  # Order queries
  getOrder(id: ID!): Order
  listOrders(
    first: Int = 10
    after: String
    filter: OrderFilter
    orderBy: OrderOrderBy = CREATED_AT_DESC
  ): OrderConnection!

  # Product queries
  getProduct(id: ID!): Product
  listProducts(
    first: Int = 10
    after: String
    filter: ProductFilter
    orderBy: ProductOrderBy = NAME_ASC
  ): ProductConnection!

  # User queries
  getUser(id: ID!): User
  listUsers(
    first: Int = 10
    after: String
    filter: UserFilter
    orderBy: UserOrderBy = CREATED_AT_DESC
  ): UserConnection!

  # Search queries
  searchProducts(query: String!, first: Int = 10, after: String): ProductConnection!
}

type OrderConnection {
  edges: [OrderEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type OrderEdge {
  node: Order!
  cursor: String!
}

type ProductConnection {
  edges: [ProductEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type ProductEdge {
  node: Product!
  cursor: String!
}

type UserConnection {
  edges: [UserEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type UserEdge {
  node: User!
  cursor: String!
}

input OrderFilter {
  customerId: ID
  status: OrderStatus
  totalMin: Float
  totalMax: Float
  createdAfter: DateTime
  createdBefore: DateTime
}

input ProductFilter {
  category: ProductCategory
  priceMin: Float
  priceMax: Float
  inStock: Boolean
  isActive: Boolean
}

input UserFilter {
  emailContains: String
  nameContains: String
}

enum OrderOrderBy {
  CREATED_AT_ASC
  CREATED_AT_DESC
  TOTAL_ASC
  TOTAL_DESC
  STATUS_ASC
  STATUS_DESC
}

enum ProductOrderBy {
  NAME_ASC
  NAME_DESC
  PRICE_ASC
  PRICE_DESC
  CREATED_AT_ASC
  CREATED_AT_DESC
}

enum UserOrderBy {
  CREATED_AT_ASC
  CREATED_AT_DESC
  NAME_ASC
  NAME_DESC
  EMAIL_ASC
  EMAIL_DESC
}

# Mutations

type Mutation {
  # Order mutations
  createOrder(input: CreateOrderInput!): CreateOrderCascade!
    @cascade(maxDepth: 3)

  updateOrder(id: ID!, input: UpdateOrderInput!): UpdateOrderCascade!
    @cascade(maxDepth: 3)

  addProductToOrder(input: AddProductToOrderInput!): AddProductToOrderCascade!
    @cascade(maxDepth: 3)

  # Product mutations
  createProduct(input: CreateProductInput!): CreateProductCascade!
    @cascade(maxDepth: 2)

  updateProduct(id: ID!, input: UpdateProductInput!): UpdateProductCascade!
    @cascade(maxDepth: 2)
}

