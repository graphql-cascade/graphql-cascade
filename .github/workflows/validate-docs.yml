name: Validate Documentation

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'docs/**'
      - 'specification/**'
      - 'research/**'
      - 'examples/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'CHANGELOG.md'
      - 'scripts/**'
      - '.github/workflows/validate-docs.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'docs/**'
      - 'specification/**'
      - 'research/**'
      - 'examples/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'CHANGELOG.md'
      - 'scripts/**'
      - '.github/workflows/validate-docs.yml'

jobs:
  validate-docs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

    - name: Setup pnpm cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --prefer-offline

    - name: Install Node.js dependencies
      run: |
        npm install -g markdownlint-cli2
        npm install -g markdown-link-check
        npm install -g cspell

    - name: Validate documentation structure
      run: |
        echo "🔍 Validating documentation structure..."
        ./scripts/validate_structure.sh

    - name: Validate documentation content
      run: |
        echo "📝 Validating documentation content..."
        ./scripts/validate_docs.sh --verbose --generate-reports --output-dir ./validation-reports || true

    - name: Test examples
      run: |
        echo "🧪 Testing code examples..."
        ./scripts/test_examples.sh

    - name: Check markdown formatting
      run: |
        echo "📏 Checking markdown formatting..."
        markdownlint-cli2 "**/*.md" --config .markdownlint.json || true

    - name: Check links
      run: |
        echo "🔗 Checking links..."
        find . -name "*.md" -exec markdown-link-check {} \; || true

    - name: Spell check
      run: |
        echo "📖 Running spell check..."
        cspell "**/*.md" --config .cspell.json || true

    - name: Upload validation reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: validation-reports
        path: ./validation-reports/
        retention-days: 7