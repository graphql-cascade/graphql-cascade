# GraphQL Cascade Base Schema
#
# The normative definition of the core types and interfaces that all
# Cascade-compliant GraphQL schemas must implement. Specification chapters
# show excerpts; `node scripts/check-spec.mjs` checks they match this file.
# Implementers add these types to their own schema, which provides the
# Query root.

"""
Marks a mutation as Cascade-compliant and configures cascade behavior.
"""
directive @cascade(
  """Maximum relationship depth to cascade through."""
  maxDepth: Int = 3

  """Whether to include related entities in the cascade."""
  includeRelated: Boolean = true

  """
  Whether to automatically compute invalidation hints.
  If false, server must manually specify invalidations.
  """
  autoInvalidate: Boolean = true

  """
  Entity types to exclude from cascade (e.g., don't cascade to audit logs).
  """
  excludeTypes: [String!]
) on FIELD_DEFINITION

"""
Marks a field as triggering cascade invalidation when this field changes.
"""
directive @cascadeInvalidates(
  """Queries to invalidate when this field changes."""
  queries: [String!]!

  """Invalidation strategy to use."""
  strategy: InvalidationStrategy = INVALIDATE
) on FIELD_DEFINITION

"""
An object with an ID, following GraphQL Global Object Identification (the
Relay Node interface). All domain entities MUST implement this interface.
"""
interface Node {
  """
  Identifier of this entity. SHOULD be unique across all types (MUST from
  2.0.0): a UUID, or an encoded "Type:key".
  """
  id: ID!
}

"""
Timestamped entities for version tracking.
"""
interface Timestamped {
  createdAt: DateTime!
  updatedAt: DateTime!
  version: Int  # Optional: for optimistic concurrency control
}

"""
Standard GraphQL Cascade mutation response.
Cascade mutations return this interface, or a result union (CascadePayload).
Payload types SHOULD also expose the mutation's primary result as a `data`
field of its own type, e.g. `data: User`; the interface leaves `data` out
because GraphQL cannot express "any result type" as a field type.
"""
interface CascadeResponse {
  """Whether the mutation succeeded."""
  success: Boolean!

  """List of errors if mutation failed or partially succeeded."""
  errors: [CascadeError!]

  """The cascade of updates triggered by this mutation."""
  cascade: CascadeUpdates!
}

"""
Implemented by the success member of a mutation result union
(`<Mutation>Result = <Mutation>Payload | CascadeFailure`), the alternative to
CascadeResponse. Payloads SHOULD also expose their result as a typed `data`.
"""
interface CascadePayload {
  """The cascade of updates triggered by this mutation."""
  cascade: CascadeUpdates!

  """Non-critical problems of a mutation that succeeded (partial success)."""
  warnings: [CascadeError!]!
}

"""
The failure member of a mutation result union: the mutation committed no
change, so there is no cascade.
"""
type CascadeFailure {
  """Why the mutation failed; at least one."""
  errors: [CascadeError!]!
}

"""
The cascade of updates triggered by a mutation.
"""
type CascadeUpdates {
  """All entities updated by this mutation (including the primary result)."""
  updated: [UpdatedEntity!]!

  """All entities deleted by this mutation."""
  deleted: [DeletedEntity!]!

  """Query invalidation hints for cache management."""
  invalidations: [QueryInvalidation!]!

  """
  Types whose affected entities are not listed individually.
  Clients treat every cached entity of each type, and every cached
  query that may contain one, as stale.
  """
  typeInvalidations: [TypeInvalidation!]!

  """Metadata about the cascade."""
  metadata: CascadeMetadata!
}

"""
Metadata about a cascade operation.
"""
type CascadeMetadata {
  """Server timestamp when mutation executed."""
  timestamp: DateTime!

  """Transaction ID for tracking (optional)."""
  transactionId: ID

  """Maximum relationship depth traversed."""
  depth: Int!

  """
  Total number of entities affected, including those covered by
  type invalidations.
  """
  affectedCount: Int!

  """
  Whether limits forced entities or invalidation hints out of this
  response. Everything omitted is covered by typeInvalidations.
  """
  truncated: Boolean!
}

"""
Every cached entity of this type, and every cached query that may
contain one, is stale.
"""
type TypeInvalidation {
  """GraphQL type name, e.g. "Post"."""
  typename: String!

  """Number of affected entities of this type, when known."""
  affectedCount: Int
}

"""
An entity that was updated in the cascade.
"""
type UpdatedEntity {
  """
  Type name of the entity (e.g., "User", "Company").
  Replaces the deprecated `__typename` pseudo-field.
  """
  typename: String!

  """ID of the entity."""
  id: ID!

  """The operation performed."""
  operation: CascadeOperation!

  """The full entity data."""
  entity: Node!

  """
  Fields whose values the update changed. Null when the server does not know,
  and for created entities, whose fields are all new.
  """
  updatedFields: [String!]
}

"""
An entity that was deleted in the cascade.
"""
type DeletedEntity {
  """
  Type name of the deleted entity.
  Replaces the deprecated `__typename` pseudo-field.
  """
  typename: String!

  """ID of the deleted entity."""
  id: ID!

  """When the entity was deleted."""
  deletedAt: DateTime!
}

"""
Type of cascade operation.
"""
enum CascadeOperation {
  CREATED
  UPDATED
  DELETED
}

"""
Instructions for cache invalidation after a mutation.
"""
type QueryInvalidation {
  """
  Query name to invalidate (e.g., "listUsers", "getCompany").
  If null, use queryPattern.
  """
  queryName: String

  """
  Hash of the query for exact matching.
  """
  queryHash: String

  """
  Arguments that identify the query to invalidate.
  Example: { "companyId": "123" }
  """
  arguments: JSON

  """
  Pattern to match queries (e.g., "list*", "get*").
  """
  queryPattern: String

  """
  Strategy for handling the invalidation.
  """
  strategy: InvalidationStrategy!

  """
  Scope of the invalidation.
  """
  scope: InvalidationScope!
}

"""
Strategy for cache invalidation.
"""
enum InvalidationStrategy {
  """Mark the query as stale, refetch on next access."""
  INVALIDATE

  """Immediately refetch the query."""
  REFETCH

  """Remove the query from cache entirely."""
  REMOVE
}

"""
Scope of cache invalidation.
"""
enum InvalidationScope {
  """Only invalidate the exact query with exact arguments."""
  EXACT

  """Invalidate all queries with names matching the prefix."""
  PREFIX

  """Invalidate all queries matching the pattern (glob-style)."""
  PATTERN

  """Invalidate all queries."""
  ALL
}

"""
Error in a cascade mutation.
"""
type CascadeError {
  """Human-readable error message."""
  message: String!

  """Machine-readable error category. Drives generic client handling."""
  code: CascadeErrorCode!

  """
  Application-defined code identifying the specific condition,
  e.g. "INSUFFICIENT_FUNDS". Refines `code`; never replaces it.
  """
  domainCode: String

  """Field that caused the error (if applicable)."""
  field: String

  """Path to the error in the input."""
  path: [String!]

  """Additional error metadata."""
  extensions: JSON
}

"""
Standard error codes for Cascade mutations.
"""
enum CascadeErrorCode {
  """Input validation failed."""
  VALIDATION_ERROR

  """Entity not found."""
  NOT_FOUND

  """User not authenticated."""
  UNAUTHORIZED

  """User lacks permission."""
  FORBIDDEN

  """Version conflict or unique constraint violation."""
  CONFLICT

  """Server error."""
  INTERNAL_ERROR

  """Database transaction failed."""
  TRANSACTION_FAILED

  """Operation timed out."""
  TIMEOUT

  """Rate limit exceeded."""
  RATE_LIMITED

  """Service temporarily unavailable."""
  SERVICE_UNAVAILABLE
}

"""
Subscription for real-time cascade updates.
"""
type Subscription {
  """
  Subscribe to cascade updates for specific entity types.
  """
  cascadeUpdates(
    """Entity types to subscribe to (e.g., ["User", "Company"])."""
    entityTypes: [String!]

    """Optional filter by entity IDs."""
    entityIds: [ID!]

    """Optional filter by operations."""
    operations: [CascadeOperation!]
  ): CascadeUpdateEvent!
}

"""
Real-time cascade update event.
"""
type CascadeUpdateEvent {
  """Type of event."""
  eventType: CascadeEventType!

  """The updated entity (for CREATED/UPDATED events)."""
  entity: UpdatedEntity

  """The deleted entity (for DELETED events)."""
  deletedEntity: DeletedEntity

  """Timestamp of the event."""
  timestamp: DateTime!

  """Transaction that caused this update."""
  transactionId: ID

  """Source of the event."""
  source: EventSource!
}

"""
Type of cascade event.
"""
enum CascadeEventType {
  ENTITY_CREATED
  ENTITY_UPDATED
  ENTITY_DELETED
}

"""
Source of the cascade event.
"""
enum EventSource {
  MUTATION     # Event from a mutation
  SUBSCRIPTION # Event from another subscription
  SYSTEM       # System-generated event
}

"""
Cascade capabilities of a server, for version discovery. Servers expose it
as a `cascadeInfo: CascadeInfo!` field on their Query type.
"""
type CascadeInfo {
  """Specification version the server implements, e.g. "1.5.0"."""
  version: String!

  """Specification versions whose responses the server can produce."""
  supportedVersions: [String!]!

  """Experimental features the server has enabled."""
  experimentalFeatures: [String!]!

  """Deprecated features the server still provides."""
  deprecatedFeatures: [String!]!
}

# Custom scalars
"""
Custom scalar for date/time values.
"""
scalar DateTime

"""
Custom scalar for JSON data.
"""
scalar JSON

# Pagination Types
"""
Connection interface for cursor-based pagination.
All list queries SHOULD use this pattern for consistency.
"""
interface Connection {
  """Information about the current page."""
  pageInfo: PageInfo!

  """Total count of items (optional but recommended)."""
  totalCount: Int
}

"""
Page information for cursor-based pagination.
"""
type PageInfo {
  """Whether there are more items after this page."""
  hasNextPage: Boolean!

  """Whether there are more items before this page."""
  hasPreviousPage: Boolean!

  """Cursor for the first item in this page."""
  startCursor: String

  """Cursor for the last item in this page."""
  endCursor: String
}

"""
Edge wrapper for cursor-based pagination.
"""
interface Edge {
  """Cursor for this item."""
  cursor: String!

  """The item itself."""
  node: Node!
}

"""
Arguments for cursor-based pagination.
"""
input PaginationArgs {
  """Number of items to return."""
  first: Int

  """Number of items to return before this cursor."""
  last: Int

  """Cursor to start after."""
  after: String

  """Cursor to start before."""
  before: String
}

"""
Arguments for offset-based pagination (MAY be used as alternative).
"""
input OffsetPaginationArgs {
  """Number of items to skip."""
  offset: Int = 0

  """Number of items to return."""
  limit: Int = 10
}

# Query naming conventions (SHOULD):
#   get<EntityType>(id: ID!): <EntityType>
#     e.g. getUser(id: ID!): User
#   list<EntityType>s(args: PaginationArgs): <EntityType>Connection
#     e.g. listUsers(args: PaginationArgs): UserConnection
#   search<EntityType>s(query: String!, args: PaginationArgs): <EntityType>Connection
#     e.g. searchUsers(query: String!, args: PaginationArgs): UserConnection
#
# Mutation naming conventions (SHOULD):
#   create<EntityType>(input: Create<EntityType>Input!): Create<EntityType>Cascade!
#     e.g. createUser(input: CreateUserInput!): CreateUserCascade!
#   update<EntityType>(id: ID!, input: Update<EntityType>Input!): Update<EntityType>Cascade!
#     e.g. updateUser(id: ID!, input: UpdateUserInput!): UpdateUserCascade!
#   delete<EntityType>(id: ID!): Delete<EntityType>Cascade!
#     e.g. deleteUser(id: ID!): DeleteUserCascade!
